<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Schedule | OpenMicFM Admin</title>

    <link rel="stylesheet" href="../css/admin.css">
</head>

<body>
    <main class="admin-app">
        <section class="dashboard-view" id="dashboard-view">

            <!-- Sidebar -->
            <aside class="sidebar">
                <a class="sidebar-brand" href="../index.html">
                    <img src="../images/logo.png" alt="OpenMicFM home">
                </a>

                <div class="sidebar-label">Station manager</div>

                <nav class="side-nav" aria-label="Dashboard sections">
                    <a class="side-link" href="overview.html">
                        <span class="nav-icon">⌂</span>
                        Overview
                    </a>

                    <a class="side-link active" href="schedule.html">
                        <span class="nav-icon">◷</span>
                        Schedule
                    </a>

                    <a class="side-link" href="music.html">
                        <span class="nav-icon">♫</span>
                        Top 10 music
                    </a>

                    <a class="side-link" href="news.html">
                        <span class="nav-icon">▤</span>
                        Newsroom
                    </a>
                </nav>

                <div class="sidebar-bottom">
                    <div class="live-status">
                        <span class="live-dot"></span>

                        <div>
                            <strong>Station online</strong>
                            <small>All systems normal</small>
                        </div>
                    </div>

                    <button
                        class="side-link logout-button"
                        id="logout-button"
                        type="button"
                    >
                        <span class="nav-icon">↪</span>
                        Sign out
                    </button>
                </div>
            </aside>

            <!-- Main Dashboard -->
            <div class="dashboard-main">

                <!-- Dashboard Header -->
                <header class="dashboard-header">
                    <div>
                        <p class="header-kicker"></p>

                        <h2 id="page-heading">
                            Plan the day <span>✦</span>
                        </h2>
                    </div>

                    <div class="profile">
                        <span>··</span>

                        <div>
                            <strong>Loading…</strong>
                            <small>Station manager</small>
                        </div>
                    </div>
                </header>

                <!-- Page Content -->
                <div class="content-wrap">
                    <section
                        class="content-section active"
                        data-panel="schedule"
                    >
                        <div class="section-heading">
                            <div>
                                <p class="eyebrow">PROGRAMMING</p>

                                <h1>Presenter schedule</h1>

                                <p class="section-subtitle">
                                    Keep the day moving, one show at a time.
                                </p>
                            </div>

                            <button
                                class="button button-primary"
                                id="add-show-button"
                                type="button"
                            >
                                + Add a show
                            </button>
                        </div>

                        <!-- Schedule Toolbar (rendered by admin.js) -->
                        <div class="toolbar"></div>

                        <!-- Weekly Calendar (rendered by admin.js) -->
                        <div class="panel schedule-table"></div>
                    </section>
                </div>
            </div>
        </section>
    </main>

    <!-- Show Details Popup -->
    <div
        class="modal-backdrop"
        id="show-details-backdrop"
        hidden
    >
        <section
            class="modal show-details-modal"
            role="dialog"
            aria-modal="true"
            aria-labelledby="show-details-title"
        >
            <button
                class="modal-close"
                id="show-details-close"
                type="button"
                aria-label="Close"
            >
                ×
            </button>

            <div id="show-details-content"></div>
        </section>
    </div>

    <!-- Add/Edit Show Modal -->
    <div
        class="modal-backdrop"
        id="modal-backdrop"
        hidden
    >
        <section
            class="modal"
            role="dialog"
            aria-modal="true"
            aria-labelledby="modal-title"
        >
            <button
                class="modal-close"
                id="modal-close"
                type="button"
                aria-label="Close"
            >
                ×
            </button>

            <p class="eyebrow">STATION MANAGER</p>

            <h2 id="modal-title">Add a show</h2>

            <form id="item-form">
                <div class="form-grid" id="modal-fields"></div>

                <button
                    class="button button-primary button-wide"
                    type="submit"
                >
                    Save changes
                </button>
            </form>
        </section>
    </div>

    <!-- JavaScript -->
    <script src="../js/admin.js"></script>
</body>
</html>
